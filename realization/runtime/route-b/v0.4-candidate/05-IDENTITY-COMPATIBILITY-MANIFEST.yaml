package:
  candidate_id: route-b-runtime-candidate-v0.4
  package_version: 0.4.0
  predecessor_candidate: route-b-runtime-candidate-v0.3
  predecessor_commit: 2c4c5fc8a3dfc3195f7c49530bbf71d6855dd9bd
  status: NON_INSTALLED_SOURCE_CANDIDATE
  created_on: 2026-08-25
  controlling_parent: Reconciled Non-Installed Candidate Source Formation
  repair_basis:
    - SR-01 named Formation activation and delta-bound re-entry without self-reactivation
    - SR-02 effective instruction and constraint owner integrity across all provider layers
    - SR-03 minimum-sufficient Subagent context, Tools, actual permissions and authority
    - SR-04 semantic stale-world reconciliation of evidence, assumptions, caveats and dependencies
    - SR-05 just-in-time scoped Method and Reference loading without Control or Authority ownership
    - SR-06 longitudinal Human capability trajectory ownership without quotas or per-episode scores
    - SR-07 dated platform compatibility evidence with recheck and retirement logic
    - SR-08 post-delivery intended-use and Whole-System-Economics ownership without universal telemetry
    - SR-09 evidence-bound persistent-control admission and retirement or simplification
  controlling_baselines:
    requirements: Requirements v0.2
    target_architecture: Target Architecture v0.2
    target_architecture_status: CLOSED
  source_formation_readiness: PASS_WITHIN_BOUNDED_REPAIR_SCOPE
  promotion: NONE
  repository_authority_changed: false

authority_order:
  - Requirements v0.2 and closed Target Architecture v0.2
  - Route B Candidate Contract
  - Canonical Kernel, Formation Method and Core Method Layer sources
  - Provider adapter compilations
  - Project-local overlays and context

