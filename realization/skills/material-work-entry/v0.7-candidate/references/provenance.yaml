claims:
  - id: "CLM-001"
    statement: "A Human message is intent evidence and not automatically a complete work order, decision, authorization, or handoff."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-002"]
    supports: ["RULE-001"]
    contradicts: []
    transfer_limits: ["Bounded direct requests may need no visible Formation."]
  - id: "CLM-002"
    statement: "Existing-system work must start from actual artifacts, state, workflow, failures, and outcomes, not topology or status labels alone."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-004"]
    supports: ["RULE-002"]
    contradicts: []
    transfer_limits: ["Only evidence material to the next frontier is required."]
  - id: "CLM-003"
    statement: "Human contribution may be continuous and non-blocking; it is broader than Human Gate."
    epistemic_status: "decision"
    source_ids: ["SRC-005", "SRC-004"]
    supports: ["RULE-003"]
    contradicts: []
    transfer_limits: ["The Next source names no separate control disposition for optional interaction; implement it inside CONTINUE."]
  - id: "CLM-004"
    statement: "Human contribution is required only where non-substitutable truth, values, expertise, authorship, acceptance, authority, or commitment materially matters."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-003", "SRC-005"]
    supports: ["RULE-003", "RULE-004"]
    contradicts: []
    transfer_limits: ["AI must first perform AI-resolvable retrieval, synthesis, craft, and checks."]
  - id: "CLM-005"
    statement: "A Human Gate exists only when a non-substitutable Human contribution blocks a material transition."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-003"]
    supports: ["RULE-004"]
    contradicts: []
    transfer_limits: []
  - id: "CLM-006"
    statement: "Handoff is required for material responsibility or environment changes and must return through parent rebind and integration."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-002", "SRC-003"]
    supports: ["RULE-005"]
    contradicts: []
    transfer_limits: ["Trivial internal calls within a bounded frontier do not require ceremony."]
  - id: "CLM-007"
    statement: "Closure, wait, handoff, monitor, or stop are legitimate frontiers; work must not be created merely because more is possible."
    epistemic_status: "decision"
    source_ids: ["SRC-001"]
    supports: ["RULE-006"]
    contradicts: []
    transfer_limits: ["Closing the current frontier does not prove the parent outcome is complete."]
  - id: "CLM-008"
    statement: "Human-facing control return must expose exact achieved state, next frontier, next actor, and exact Human action when material."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-002", "SRC-003"]
    supports: ["RULE-001", "RULE-006"]
    contradicts: []
    transfer_limits: ["Obvious one-shot answers may close implicitly."]
  - id: "CLM-009"
    statement: "An accessible source, connector, repository, or observed workflow is an evidence slice and must not silently define the material System of Interest."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-006"]
    supports: ["RULE-007"]
    contradicts: []
    transfer_limits: ["A Human may explicitly and legitimately bound the task to one source or surface."]
  - id: "CLM-010"
    statement: "When work becomes materially cross-session, accumulating, cross-surface, risky, or authority-sensitive, minimal controlling state must be instantiated before material evidence accumulation or dispatch."
    epistemic_status: "decision"
    source_ids: ["SRC-001", "SRC-002", "SRC-003", "SRC-006"]
    supports: ["RULE-008"]
    contradicts: []
    transfer_limits: ["Bootstrap must remain proportionate and does not require a new Project or CURRENT.md when an adequate carrier already exists."]
