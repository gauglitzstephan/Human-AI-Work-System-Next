schema_version: "0.1"
objects:
  - "Parent Work Object"
  - "Work Unit"
  - "Next Frontier"
  - "Work Product"
  - "Human Contribution"
  - "Human Gate"
  - "Frontier Handoff"
  - "Provider Return"
  - "Human-facing Control Return"
  - "System of Interest"
  - "Evidence Slice"
  - "Minimal Bootstrap"
  - "Persistence Carrier"
actors: ["Human", "Controller", "Capability Provider", "Authority Owner"]
states: ["BOUND", "NEW/CHANGED", "FORMATION", "BOOTSTRAP REQUIRED", "BOOTSTRAPPED", "READY", "CONTINUE", "HUMAN GATE", "HANDOFF", "WAIT", "MONITOR", "CLOSE", "STOP"]
transitions:
  - "Raw input to bound frontier"
  - "Formation to ready work"
  - "Formation to focused Human contribution"
  - "Formation to Human Gate"
  - "Ready frontier to execution"
  - "Responsibility change to handoff"
  - "Provider return to parent rebind"
  - "Qualified frontier to control return"
  - "Persistent frontier to minimal bootstrap"
attributes: ["Outcome", "Scope", "Observed slice", "Unobserved boundary", "Method", "Evidence and uncertainty", "Requirements and performance bar", "Authority", "Provider and surface", "Assurance", "Persistence location and owner", "Persistence and promotion status"]
relations:
  - "A Work Unit contributes to a Parent Work Object."
  - "A Work Function uses a Method and a Provider but is not either one."
  - "A Human Gate is a blocking subtype of required Human contribution, not the whole class."
  - "A useful Human contribution can occur inside CONTINUE without blocking safe parallel work."
  - "A Provider Return must be rebound before the next parent claim."
  - "An Evidence Slice contributes to but does not define the System of Interest."
  - "A Minimal Bootstrap carries controlling work state but does not become universal domain authority."
evidence_types:
  - "Provided or connected private state"
  - "Public source or measurement"
  - "Professional method or precedent"
  - "Observed incident or outcome"
  - "Human-exclusive contribution"
  - "AI inference or synthesis"
actions: ["Bind", "Discover boundary", "Recover", "Form", "Bootstrap", "Acquire", "Compare", "Ask", "Execute", "Assure", "Hand off", "Rebind", "Close"]
rules:
  - "Human message is intent evidence, not automatically a complete work order."
  - "Human contribution is required only for materially non-substitutable Human properties."
  - "A Gate is compiled only when that contribution blocks a material transition."
  - "A handoff is compiled only when responsibility or environment materially changes or state can be lost."
  - "Tool or connector availability never defines the whole System of Interest by itself."
  - "Persistent work is bootstrapped before material accumulation or dispatch when transient chat state is insufficient."
  - "Closure ends the current frontier or loop and need not complete the parent outcome."
exceptions:
  - "Obvious bounded one-shot work may execute and close implicitly."
  - "Trivial internal tool or Skill use does not require ceremonial handoff."
  - "Bounded work without material continuity needs does not require a Project or persistent bootstrap."
risks:
  - "Human Contribution collapsed into Human Gate"
  - "Generic process narration replaces the Work Product"
  - "Professional method omitted"
  - "Plan returned instead of ready execution"
  - "Handoff amnesia"
  - "Closure ambiguity"
  - "Evidence-slice scope collapse"
  - "Missing persistence bootstrap"
confusions:
  - "Work Function versus Method"
  - "Skill versus Provider versus Surface"
  - "Human contribution versus Human Gate"
  - "Provider Return versus Human-facing Control Return"
  - "Current frontier closed versus parent outcome complete"
  - "Context container versus controlling state versus domain authority"
unknowns:
  - "Optimal interruption threshold for optional Human contribution is context-dependent judgment."
