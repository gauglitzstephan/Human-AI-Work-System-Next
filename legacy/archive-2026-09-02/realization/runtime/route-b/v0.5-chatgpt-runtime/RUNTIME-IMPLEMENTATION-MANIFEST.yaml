method_realization:
  eligibility: Work Function + Intended Use + Performance Floor + Domain + Evidence Need
  resolution_order:
    - already_qualified_domain_skill_or_method_pack
    - fit_repository_method_registry_pack
    - other_qualified_project_drive_repository_source
    - current_authoritative_external_method_or_standard
    - transparent_task_local_method_with_limitations
    - qualified_human_or_specialist
  inadequate_basis: weaken_claim_or_wait_handoff_stop
  registry_gateway: false

mixed_runtime_rule:
  requirement: exactly_one_formation_activation_owner_per_claimed_path
  legacy_material_work_entry_and_work_formation_coactive: PROHIBITED
  cutover_minimum: before enabling a claimed Route-B path, disable/remove the legacy Formation owner on that same target surface and confirm work-formation is available there
  rollback_minimum: retain the immediately replaced UI text/skill identity only as needed to restore the actual pre-cutover state; no separate historical reconstruction program

platform_facts:
  evidence_date: 2026-08-25
  owner: runtime_operating
  facts:
    - Project Instructions override Global Custom Instructions inside the Project
    - Personal Skills must be added separately on desktop and web/mobile and do not automatically sync across those surfaces
    - Skills may contain instructions, examples, supporting resources and optional code; executable scripts are not mandatory
  recheck_trigger:
    - material ChatGPT surface/build change
    - changed Project instruction precedence
    - changed Skill installation/synchronization behavior
    - changed target carrier capacity
  retirement_condition: replace this fact set when newer direct UI or official provider evidence supersedes it

installation_gate:
  static_functional_assurance: PENDING
  target_surface_skill_availability: PENDING_DIRECT_UI
  project_instruction_capacity: PENDING_DIRECT_UI
  runtime_behavior: UNVERIFIED
  intended_use_fitness: UNVERIFIED
  promotion: NONE
